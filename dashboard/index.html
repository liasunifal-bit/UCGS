            background: var(--surface-alt);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .hist-modal-close:hover { background: var(--border); color: var(--text-primary); }
        .hist-modal-close:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        .hist-modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }
        .hist-modal-field {
            margin-bottom: 16px;
        }
        .hist-modal-field:last-child { margin-bottom: 0; }
        .hist-modal-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .hist-modal-value {
            font-size: 0.875rem;
            color: var(--text-primary);
            line-height: 1.5;
        }
        .hist-modal-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media(max-width:500px) { .hist-modal-row { grid-template-columns: 1fr; } }

        .hist-modal-status-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hist-modal-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .hist-modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-shrink: 0;
        }
        .hist-modal-btn {
            padding: 8px 18px;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            transition: all 0.15s;
        }
        .hist-modal-btn:hover { background: var(--surface-alt); }
        .hist-modal-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .hist-modal-btn.primary:hover { filter: brightness(1.1); }
        .hist-modal-btn.danger {
            color: var(--danger);
            border-color: var(--danger);
        }
        .hist-modal-btn.danger:hover { background: #FEE2E2; }
        body.dark-mode .hist-modal-btn.danger:hover { background: #3d1515; }

        /* ===== HISTÓRICO — NEW RECORD MODAL ===== */
        .hist-form-group {
            margin-bottom: 14px;
        }
        .hist-form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .hist-form-input, .hist-form-select, .hist-form-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            font-size: 0.85rem;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .hist-form-input:focus, .hist-form-select:focus, .hist-form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
        }
        .hist-form-textarea { resize: vertical; min-height: 80px; }
        .hist-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media(max-width:500px) { .hist-form-row { grid-template-columns: 1fr; } }

        /* ===== HISTÓRICO — TOAST ===== */
        .hist-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10000;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 500;
            color: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
            pointer-events: none;
        }
        .hist-toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .hist-toast.success { background: #059669; }
        .hist-toast.info { background: #0284C7; }
        .hist-toast.warning { background: #D97706; }
        .hist-toast.error { background: #DC2626; }

        /* ===== HISTÓRICO — EMPTY STATE ===== */
        .hist-empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }
        .hist-empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
        .hist-empty-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
        .hist-empty-desc { font-size: 0.85rem; }

        /* ===== HISTÓRICO — LOADING SKELETON ===== */
        @keyframes histShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .hist-loading-bar {
            height: 14px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--border) 25%, var(--surface-alt) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: histShimmer 1.5s infinite;
            margin-bottom: 8px;
        }
        .hist-loading-bar.short { width: 60%; }
        .hist-loading-bar.medium { width: 80%; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--surface-alt);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
            color: #FFFFFF;
            box-shadow: 1px 0 3px rgba(0,0,0,0.15);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Removed: logo area blur/glow — clean flat background */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 110px;
            background: none;
            z-index: 1;
            pointer-events: none;
        }

        .sidebar .nav-icon {
            font-size: 1.15rem;
            filter: none;
            opacity: 0.85;
        }

        .sidebar .nav-item {
            color: #EAEAEA;
        }

        .sidebar .nav-item:hover {
            color: #FFFFFF;
        }

        .sidebar .nav-item.active {
            color: #FFFFFF;
        }

        .sidebar .nav-label {
            color: rgba(234, 234, 234, 0.55);
        }

        .sidebar .user-info,
        .sidebar .user-name,
        .sidebar .user-role {
            color: #EAEAEA;
        }

        .sidebar a {
            color: #EAEAEA;
        }

        /* ===== SIDEBAR HEADER — REFINED BRAND AREA ===== */
        @keyframes ucgsBrandFadeIn {
            0% { opacity: 0; transform: translateY(-12px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes ucgsAccentShimmer {
            0%   { background-position: -80% center; }
            100% { background-position: 220% center; }
        }

        /* ucgsGlowSweep removed — replaced by synchronized linear ray */

        @keyframes ucgsLogoPulse {
            0%, 100% {
                box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.06), 0 3px 10px rgba(0,0,0,0.20);
            }
            50% {
                box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.10), 0 4px 14px rgba(0,0,0,0.25);
            }
        }

        @keyframes ucgsTextGlow {
            0%, 100% { text-shadow: none; }
            50% { text-shadow: none; }
        }

        @keyframes ucgsLogoRotateIn {
            0% { opacity: 0; transform: rotate(-8deg) scale(0.8); }
            60% { transform: rotate(2deg) scale(1.02); }
            100% { opacity: 1; transform: rotate(0deg) scale(1); }
        }

        .sidebar-header {
            padding: 28px 18px 24px;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            z-index: 2;
            overflow: visible;
            animation: ucgsBrandFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* ── Light beam — single ray strip on top of logo ── */
        .sidebar-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                transparent 0%,
                transparent 15%,
                rgba(16, 185, 129, 0.25) 22%,
                rgba(16, 185, 129, 0.65) 28%,
                rgba(14, 165, 233, 0.80) 35%,
                rgba(56, 189, 248, 0.95) 42%,
                rgba(56, 189, 248, 1) 50%,
                rgba(56, 189, 248, 0.95) 58%,
                rgba(14, 165, 233, 0.80) 65%,
                rgba(125, 211, 252, 0.65) 72%,
                rgba(125, 211, 252, 0.25) 78%,
                transparent 85%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: ucgsAccentShimmer 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: 3;
        }

        /* ── Soft vertical light bleed from beam into logo area ── */
        .sidebar-header::after {
            content: '';
            position: absolute;
            top: 0; left: 5%; right: 5%;
            height: 70px;
            background: linear-gradient(180deg,
                rgba(40, 180, 220, 0.07) 0%,
                rgba(14, 165, 233, 0.03) 40%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
            text-decoration: none;
            cursor: default;
            user-select: none;
            animation: ucgsBrandFadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        /* Logo icon wrapper — clean frame */
        .logo-icon {
            width: 62px;
            height: 62px;
            flex-shrink: 0;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 2px 8px rgba(0,0,0,0.20);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            animation: ucgsLogoRotateIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .logo:hover .logo-icon {
            box-shadow: 0 3px 12px rgba(0,0,0,0.25);
            transform: translateY(-1px) scale(1.02);
            border-color: rgba(255,255,255,0.15);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            padding: 3px;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), filter 0.3s ease;
        }

        .logo:hover .logo-icon img {
            transform: scale(1.03);
        }

        /* Brand text block */
        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 5px;
            line-height: 1;
            min-width: 0;
            animation: ucgsBrandFadeIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
        }

        /* System acronym */
        .logo-text::before {
            content: 'UCGS';
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.20em;
            color: #EAEAEA;
            line-height: 1;
            transition: color 0.3s ease, letter-spacing 0.3s ease;
        }

        .logo:hover .logo-text::before {
            color: #93C5FD;
            letter-spacing: 0.22em;
        }

        /* System full name — symmetric 3-word layout */
        .logo-text::after {
            content: 'Universidade +\a Comunidade +\a Gestão em Saúde';
            white-space: pre-line;
            display: block;
            font-size: 0.5rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(200, 210, 230, 0.40);
            line-height: 1.55;
            transition: color 0.3s ease;
        }

        .logo:hover .logo-text::after {
            color: rgba(200, 220, 255, 0.70);
        }

        /* Hide the original inline text since we now render via CSS */
        .logo > .logo-text-inline {
            display: none;
        }

        .nav-section {
            padding: 16px 16px;
        }

        .nav-section:first-of-type {
            padding-top: 20px;
        }

        .nav-label {
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            color: rgba(234, 234, 234, 0.35);
            margin-bottom: 10px;
            padding: 0 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            color: #EAEAEA;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 4px;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            bottom: 15%;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--primary);
            opacity: 0;
            transform: scaleY(0);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.07);
            color: #FFFFFF;
            transform: translateX(2px);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(14, 165, 233, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
            color: #FFFFFF;
            font-weight: 600;
        }

        .nav-item.active::before {
            opacity: 1;
            transform: scaleY(1);
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.5), 0 0 16px rgba(14, 165, 233, 0.2);
        }

        .nav-item.active .nav-icon {
            filter: drop-shadow(0 0 4px rgba(14, 165, 233, 0.4));
            transform: scale(1.08);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-user {
            margin-top: auto;
            padding: 20px 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7C3AED);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--sidebar-text);
        }

        /* Main Content */
        .main-content {
            margin-left: 240px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        @keyframes searchGlowPulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.08); }
            50% { box-shadow: 0 0 0 5px rgba(14, 165, 233, 0.15), 0 0 20px rgba(14, 165, 233, 0.06); }
        }
        @keyframes searchIconBounce {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.15); }
        }
        @keyframes searchSpinner {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            background: var(--surface);
            color: var(--text-primary);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-bar input::placeholder {
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .search-bar input:hover {
            border-color: color-mix(in srgb, var(--primary) 40%, var(--border));
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1), 0 4px 16px rgba(14, 165, 233, 0.06);
            animation: searchGlowPulse 2.5s ease-in-out infinite;
        }

        .search-bar input:focus::placeholder {
            opacity: 0.5;
            transform: translateX(4px);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-bar.focused .search-icon {
            color: var(--primary);
            animation: searchIconBounce 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-bar.loading .search-icon {
            font-size: 0;
            width: 16px;
            height: 16px;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .search-bar.loading .search-icon::after {
            content: '';
            display: block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: searchSpinner 0.7s linear infinite;
            box-sizing: border-box;
        }

        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-secondary);
            color: white;
            font-size: 0.65rem;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.15s;
            line-height: 1;
        }
        .search-clear:hover { opacity: 1; }
        .search-bar.has-value .search-clear { display: flex; }

        /* ===== SEARCH DROPDOWN ===== */
        @keyframes searchDropdownSlide {
            from { opacity: 0; transform: translateY(-8px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes searchResultFadeIn {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .search-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--dropdown-shadow);
            z-index: 400;
            overflow: hidden;
            max-height: 420px;
            overflow-y: auto;
            transform-origin: top center;
        }
        .search-dropdown.open {
            display: block;
            animation: searchDropdownSlide 0.25s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .search-category-label {
            padding: 10px 16px 6px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            animation: searchResultFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        .search-result-item:nth-child(1) { animation-delay: 0.03s; }
        .search-result-item:nth-child(2) { animation-delay: 0.06s; }
        .search-result-item:nth-child(3) { animation-delay: 0.09s; }
        .search-result-item:nth-child(4) { animation-delay: 0.12s; }
        .search-result-item:nth-child(5) { animation-delay: 0.15s; }
        .search-result-item:nth-child(6) { animation-delay: 0.18s; }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover,
        .search-result-item.active {
            background: var(--primary-light);
            transform: translateX(3px);
        }

        .search-result-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: var(--surface-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .search-result-info { flex: 1; min-width: 0; }

        .search-result-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-result-title mark {
            background: transparent;
            color: var(--primary);
            font-weight: 700;
        }

        .search-result-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .search-result-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--primary-light);
            color: var(--primary);
            flex-shrink: 0;
        }

        .search-empty {
            padding: 32px 16px;
            text-align: center;
            color: var(--text-secondary);
        }
        .search-empty-icon { font-size: 2rem; margin-bottom: 8px; }
        .search-empty-title { font-size: 0.875rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
        .search-empty-sub { font-size: 0.8rem; }

        .search-footer {
            padding: 8px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface-alt);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .search-footer-hint {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1px 5px;
            background: var(--border);
            border-radius: 3px;
            font-size: 0.65rem;
            font-family: monospace;
            color: var(--text-secondary);
        }

        /* Dark mode adjustments */
        body.dark-mode .search-result-item:hover,
        body.dark-mode .search-result-item.active { background: rgba(56, 189, 248, 0.08); }
        body.dark-mode .search-result-badge { background: rgba(56, 189, 248, 0.12); color: #38BDF8; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-btn {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-alt);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .notification-btn:hover {
            background: var(--border);
        }

        .notification-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            min-width: 18px;
            height: 18px;
            background: var(--danger);
            border-radius: 999px;
            border: 2px solid var(--surface);
            font-size: 0.65rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7C3AED);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            color: white;
            cursor: pointer;
        }

        /* Page Content */
        .page-content {
            padding: 28px 32px;
            max-width: 1400px;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        @keyframes sectionFadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: flex;
            flex-direction: column;
            flex: 1;
            animation: sectionFadeSlideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .breadcrumb {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: var(--primary);
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Alert Cards */
        .alerts-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 24px;
        }

        .alert-card {
            background: var(--surface);
            border-left: 4px solid;
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .alert-card:hover {
            box-shadow: var(--shadow-elevated);
            transform: translateX(4px);
        }

        .alert-card.warning {
            border-color: var(--warning);
        }

        .alert-card.danger {
            border-color: var(--danger);
        }

        .alert-card.info {
            border-color: var(--primary);
        }

        .alert-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .alert-icon.warning {
            background: #FEF3C7;
        }

        .alert-icon.danger {
            background: #FEE2E2;
        }

        .alert-icon.info {
            background: #DBEAFE;
        }

        .alert-content {
            flex: 1;
        }

        .alert-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .alert-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .alert-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .alert-badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-urgent {
            background: #FEE2E2;
            color: #991B1B;
        }

        .badge-high {
            background: #FEF3C7;
            color: #92400E;
        }

        .badge-medium {
            background: #DBEAFE;
            color: #1E40AF;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-elevated);
            transform: translateY(-2px);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .stat-footer {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Protocol Cards */
        .protocol-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .protocol-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .protocol-card:hover {
            box-shadow: var(--shadow-elevated);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .protocol-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .protocol-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .protocol-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .protocol-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .protocol-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .protocol-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .protocol-action {
            padding: 6px 12px;
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .protocol-action:hover {
            background: var(--primary);
            color: white;
        }

        /* Table */
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .btn-primary {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-primary:hover {
            background: #0284C7;
        }

        .btn-secondary {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--surface-alt);
        }

        th {
            text-align: left;
            padding: 12px 24px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        td {
            padding: 16px 24px;
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
        }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: var(--surface-alt);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
        }

        .badge-success {
            background: #D1FAE5;
            color: #065F46;
        }

        .badge-warning {
            background: #FEF3C7;
            color: #92400E;
        }

        .badge-danger {
            background: #FEE2E2;
            color: #991B1B;
        }

        .badge-info {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .badge-neutral {
            background: #F1F5F9;
            color: #475569;
        }

        /* ===== CONTATOS — 3D POLISHED ACRYLIC & JADE REDESIGN ===== */

        /* ── CSS VARIABLES ── */
        :root {
            --jade-deep:     #0D4A2E;
            --jade-mid:      #145A38;
            --jade-surface:  #1A6E44;
            --jade-light:    #2E9E65;
            --jade-bevel-hi: #3DBE7A;
            --jade-bevel-lo: #0A3520;
            --jade-shine:    rgba(255,255,255,0.22);
            --jade-shadow:   rgba(0,0,0,0.55);
            --acrylic-bg:    #FFFFFF;
            --acrylic-tint:  rgba(240,253,248,0.85);
        }

        /* ── PAGE HEADER ── */
        .contatos-page-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .contatos-breadcrumb {
            justify-content: center !important;
        }

        /* ── GRID: SYMMETRIC TWO-COLUMN ── */
        .contatos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 36px;
            margin-bottom: 40px;
            max-width: 940px;
            margin-left: auto;
            margin-right: auto;
            align-items: stretch;
            /* Perspective for child 3D transforms */
            perspective: 1200px;
        }

        @media (max-width: 800px) {
            .contatos-grid {
                grid-template-columns: 1fr;
                max-width: 480px;
            }
        }

        /* ── CARD BASE — POLISHED JADE FRAME ── */
        .contato-card {
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.23,1,0.32,1),
                        box-shadow 0.35s cubic-bezier(0.23,1,0.32,1);

            /* Outer jade rim — micro-beveled thick border */
            border: 3px solid transparent;
            background-clip: padding-box;

            /* Multi-layer shadow: ambient + key + rim glow */
            box-shadow:
                /* Outer rim — jade bevel highlight (top-left) */
                -2px -2px 0px 0px var(--jade-bevel-hi),
                /* Outer rim — jade bevel shadow (bottom-right) */
                2px 2px 0px 0px var(--jade-bevel-lo),
                /* Deep drop shadow — physical depth */
                0 12px 40px rgba(0,0,0,0.28),
                0 4px 16px rgba(0,0,0,0.20),
                0 2px 6px rgba(0,0,0,0.15),
                /* Subtle jade ambient glow */
                0 0 0 3px var(--jade-mid),
                0 0 0 4px var(--jade-deep),
                /* Far cast shadow */
                0 24px 60px rgba(13,74,46,0.22);

            /* Inner card face — polished acrylic white */
            background: linear-gradient(
                160deg,
                #f8fffe 0%,
                #f2fdf8 30%,
                #ffffff 60%,
                #f5fdfb 100%
            );
        }

        /* Top-left light catch — the "polished acrylic" shine */
        .contato-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.55) 0%,
                rgba(255,255,255,0.10) 35%,
                transparent 60%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Bottom-right brushed metal sheen */
        .contato-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(
                315deg,
                rgba(180,220,200,0.18) 0%,
                transparent 50%
            );
            pointer-events: none;
            z-index: 1;
        }

        .contato-card:hover {
            transform: translateY(-8px) scale(1.015) rotateX(1.5deg);
            box-shadow:
                -2px -2px 0px 0px var(--jade-bevel-hi),
                2px 2px 0px 0px var(--jade-bevel-lo),
                0 24px 64px rgba(0,0,0,0.32),
                0 8px 24px rgba(0,0,0,0.22),
                0 4px 10px rgba(0,0,0,0.16),
                0 0 0 3px var(--jade-surface),
                0 0 0 4px var(--jade-mid),
                0 36px 80px rgba(13,74,46,0.30),
                /* hover jade glow ring */
                0 0 32px rgba(30,110,68,0.20);
        }

        /* ── JADE FRAME STRIP (top accent) ── */
        .contato-card-jade-strip {
            height: 6px;
            background: linear-gradient(
                90deg,
                var(--jade-bevel-lo) 0%,
                var(--jade-mid) 20%,
                var(--jade-light) 45%,
                var(--jade-bevel-hi) 55%,
                var(--jade-surface) 75%,
                var(--jade-mid) 88%,
                var(--jade-bevel-lo) 100%
            );
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        /* ── CARD HEADER ── */
        .contato-card-header {
            padding: 22px 26px 18px;
            border-bottom: 1px solid rgba(13,74,46,0.12);
            display: flex;
            align-items: center;
            gap: 16px;
            background: linear-gradient(
                135deg,
                #EDF7F2 0%,
                #F5FBF8 50%,
                #EAF6F0 100%
            );
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        /* 3D Relief Icon Container */
        .contato-icon-wrap {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            position: relative;

            /* Polished jade face */
            background: linear-gradient(
                145deg,
                #2EA868 0%,
                #1A6E44 40%,
                #0D4A2E 100%
            );

            /* Beveled 3D shadow */
            box-shadow:
                /* highlight bevel (top-left) */
                inset 2px 2px 4px rgba(255,255,255,0.30),
                /* shadow bevel (bottom-right) */
                inset -2px -2px 4px rgba(0,0,0,0.40),
                /* outer drop */
                0 4px 12px rgba(13,74,46,0.45),
                0 1px 3px rgba(0,0,0,0.30);

            /* Color the emoji to show through */
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
        }

        /* Shine glint on icon */
        .contato-icon-wrap::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 6px;
            width: 60%;
            height: 35%;
            background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, transparent 100%);
            border-radius: 8px 8px 50% 50%;
            pointer-events: none;
        }

        /* Hierarquia tipográfica uniforme no header */
        .contato-org-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0D3B26;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }
        .contato-org-type {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--jade-surface);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── CARD BODY ── */
        .contato-body {
            padding: 22px 26px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            position: relative;
            z-index: 2;
            background: transparent;
        }

        /* Info rows */
        .contato-row {
            display: flex;
            align-items: flex-start;
            gap: 13px;
        }

        /* 3D icon chip */
        .contato-row-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 1px;
            background: linear-gradient(
                145deg,
                #ECF9F2 0%,
                #D4F0E4 100%
            );
            border: 1px solid rgba(13,74,46,0.15);
            box-shadow:
                inset 1px 1px 2px rgba(255,255,255,0.85),
                inset -1px -1px 2px rgba(13,74,46,0.12),
                0 2px 6px rgba(13,74,46,0.12);
        }

        .contato-row-info { flex: 1; }

        .contato-row-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--jade-surface);
            margin-bottom: 3px;
        }

        .contato-row-value {
            font-size: 0.875rem;
            color: #1A2E26;
            font-weight: 500;
            line-height: 1.55;
        }

        /* ── CARD FOOTER — 3D TACTILE BUTTONS ── */
        .contato-card-footer {
            padding: 16px 26px 20px;
            border-top: 1px solid rgba(13,74,46,0.10);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            background: linear-gradient(180deg, rgba(240,253,248,0.6) 0%, rgba(225,248,238,0.9) 100%);
        }

        /* ── BUTTON: LIGAR — Solid 3D jade ── */
        .btn-contato-ligar {
            flex: 1;
            padding: 11px 14px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.23,1,0.32,1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-decoration: none;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;

            /* Solid deep green face */
            background: linear-gradient(
                160deg,
                #1E9058 0%,
                #145A38 45%,
                #0D4A2E 100%
            );
            color: #FFFFFF;

            /* Multi-layer 3D shadow */
            box-shadow:
                /* bevel highlight (top edge) */
                inset 0 1.5px 0 rgba(255,255,255,0.28),
                /* bevel shadow (bottom edge) */
                inset 0 -2px 0 rgba(0,0,0,0.35),
                /* physical drop */
                0 4px 0 #062918,
                0 6px 12px rgba(0,0,0,0.28),
                0 2px 4px rgba(0,0,0,0.20);
        }

        .btn-contato-ligar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
            border-radius: 10px 10px 50% 50%;
            pointer-events: none;
        }

        .btn-contato-ligar svg { flex-shrink: 0; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3)); }

        .btn-contato-ligar:hover {
            background: linear-gradient(160deg, #25A864 0%, #186844 45%, #0F5534 100%);
            transform: translateY(-3px);
            box-shadow:
                inset 0 1.5px 0 rgba(255,255,255,0.28),
                inset 0 -2px 0 rgba(0,0,0,0.35),
                0 6px 0 #062918,
                0 10px 20px rgba(13,74,46,0.42),
                0 4px 8px rgba(0,0,0,0.25);
        }

        .btn-contato-ligar:active {
            transform: translateY(2px);
            box-shadow:
                inset 0 1.5px 0 rgba(255,255,255,0.20),
                inset 0 -1px 0 rgba(0,0,0,0.30),
                0 2px 0 #062918,
                0 3px 6px rgba(0,0,0,0.20);
        }

        /* ── BUTTON: VER NO MAPA — Outlined 3D jade ── */
        .btn-contato-maps {
            flex: 1;
            padding: 11px 14px;
            border-radius: 10px;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.23,1,0.32,1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-decoration: none;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;

            /* Frosted acrylic face with jade border */
            background: linear-gradient(
                160deg,
                rgba(255,255,255,0.95) 0%,
                rgba(236,252,244,0.90) 100%
            );
            color: var(--jade-deep);
            border: 2px solid var(--jade-mid);

            box-shadow:
                inset 0 1.5px 0 rgba(255,255,255,0.9),
                inset 0 -1.5px 0 rgba(13,74,46,0.15),
                0 3px 0 rgba(13,74,46,0.30),
                0 5px 10px rgba(0,0,0,0.15),
                0 2px 4px rgba(0,0,0,0.10);
        }

        .btn-contato-maps::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, transparent 100%);
            border-radius: 8px 8px 50% 50%;
            pointer-events: none;
        }

        .btn-contato-maps svg { flex-shrink: 0; }

        .btn-contato-maps:hover {
            background: linear-gradient(160deg, #EDF9F3 0%, #D4F0E4 100%);
            color: var(--jade-mid);
            border-color: var(--jade-surface);
            transform: translateY(-3px);
            box-shadow:
                inset 0 1.5px 0 rgba(255,255,255,0.9),
                inset 0 -1.5px 0 rgba(13,74,46,0.15),
                0 5px 0 rgba(13,74,46,0.25),
                0 8px 16px rgba(13,74,46,0.22),
                0 3px 6px rgba(0,0,0,0.12);
        }

        .btn-contato-maps:active {
            transform: translateY(1px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.7),
                inset 0 -1px 0 rgba(13,74,46,0.10),
                0 1px 0 rgba(13,74,46,0.20),
                0 2px 4px rgba(0,0,0,0.08);
        }

        /* ── DARK MODE ── */
        body.dark-mode .contato-card {
            background: linear-gradient(160deg, #16293F 0%, #1E2F42 50%, #152438 100%);
            box-shadow:
                -2px -2px 0px 0px #2EA868,
                2px 2px 0px 0px #062918,
                0 12px 40px rgba(0,0,0,0.55),
                0 4px 16px rgba(0,0,0,0.40),
                0 0 0 3px #145A38,
                0 0 0 4px #0D4A2E,
                0 24px 60px rgba(13,74,46,0.30);
        }
        body.dark-mode .contato-card:hover {
            box-shadow:
                -2px -2px 0px 0px #3DBE7A,
                2px 2px 0px 0px #062918,
                0 24px 64px rgba(0,0,0,0.65),
                0 8px 24px rgba(0,0,0,0.45),
                0 0 0 3px #1A6E44,
                0 0 0 4px #145A38,
                0 36px 80px rgba(13,74,46,0.45);
        }
        body.dark-mode .contato-card-header {
            background: linear-gradient(135deg, rgba(26,110,68,0.20) 0%, rgba(13,74,46,0.15) 100%);
            border-bottom-color: rgba(45,158,101,0.20);
        }
        body.dark-mode .contato-org-name   { color: #C8F0DC; }
        body.dark-mode .contato-org-type   { color: #6BCFA0; }
        body.dark-mode .contato-row-value  { color: #B8E8CE; }
        body.dark-mode .contato-row-icon   { background: rgba(26,110,68,0.25); border-color: rgba(45,158,101,0.25); }
        body.dark-mode .contato-card-footer { background: linear-gradient(180deg, rgba(13,74,46,0.15) 0%, rgba(13,74,46,0.25) 100%); border-top-color: rgba(45,158,101,0.20); }
        body.dark-mode .contatos-nota      { background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.2); }
        body.dark-mode .btn-contato-maps   { background: linear-gradient(160deg, rgba(26,110,68,0.35) 0%, rgba(13,74,46,0.50) 100%); color: #6BCFA0; border-color: #2E9E65; }
        body.dark-mode .btn-contato-maps:hover { background: linear-gradient(160deg, rgba(46,168,104,0.40) 0%, rgba(26,110,68,0.55) 100%); }
        body.dark-mode .contato-card::before { background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%); }
        body.dark-mode .contato-card::after  { background: linear-gradient(315deg, rgba(45,158,101,0.12) 0%, transparent 50%); }

        /* ═══════════════════════════════════════════════════════
           PROTOCOLOS DE ACIDENTES — Fullscreen Modal + Details
           ═══════════════════════════════════════════════════════ */

        /* Summary Stats Bar for Acidentes */
        .acid-summary-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        @media(max-width:900px) { .acid-summary-bar { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width:500px) { .acid-summary-bar { grid-template-columns: 1fr; } }

        .acid-stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .acid-stat-card:hover { box-shadow: var(--shadow-elevated); transform: translateY(-2px); }
        .acid-stat-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            border-radius: 4px 0 0 4px;
        }
        .acid-stat-card.blue::before { background: linear-gradient(180deg, #38BDF8, #0EA5E9); }
        .acid-stat-card.rose::before { background: linear-gradient(180deg, #FB7185, #F43F5E); }
        .acid-stat-card.emerald::before { background: linear-gradient(180deg, #34D399, #10B981); }
        .acid-stat-card.amber::before { background: linear-gradient(180deg, #FCD34D, #F59E0B); }

        .acid-stat-icon {
            width: 48px; height: 48px;
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .acid-stat-value {
            font-size: 1.75rem; font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1.1;
        }
        .acid-stat-label {
            font-size: 0.75rem; font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Protocol Card Enhancements */
        .protocol-card .protocol-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .protocol-status-pill.active { background: #D1FAE5; color: #065F46; }
        .protocol-status-pill.review { background: #FEE2E2; color: #991B1B; }
        body.dark-mode .protocol-status-pill.active { background: #0e3020; color: #34D399; }
        body.dark-mode .protocol-status-pill.review { background: #3d1515; color: #F87171; }

        /* ── Registrar Acidente Fullscreen Modal ── */
        .acid-fs-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
            opacity: 0;
        }
        .acid-fs-backdrop.open { display: flex; opacity: 1; align-items: center; justify-content: center; }
        .acid-fs-backdrop.closing { opacity: 0; }

        .acid-fs-panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 95vw;
            max-width: 820px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 80px rgba(0,0,0,0.25);
            transform: translateY(30px) scale(0.97);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }
        .acid-fs-backdrop.open .acid-fs-panel { transform: translateY(0) scale(1); }
        .acid-fs-backdrop.closing .acid-fs-panel { transform: translateY(30px) scale(0.97); }

        .acid-fs-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--surface);
        }
        .acid-fs-header-left {
            display: flex; align-items: center; gap: 14px;
        }
        .acid-fs-header-icon {
            width: 44px; height: 44px;
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            background: #DBEAFE; color: #0EA5E9;
        }
        .acid-fs-header-title {
            font-size: 1.125rem; font-weight: 700;
            color: var(--text-primary);
        }
        .acid-fs-header-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .acid-fs-close {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .acid-fs-close:hover { background: #FEE2E2; border-color: #DC2626; color: #DC2626; }

        .acid-fs-body {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
        }

        /* Form Sections */
        .acid-form-section {
            margin-bottom: 28px;
        }
        .acid-form-section-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .acid-form-section-icon {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .acid-form-section-title {
            font-size: 0.9rem; font-weight: 700;
            color: var(--text-primary);
        }

        .acid-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media(max-width:640px) { .acid-form-grid { grid-template-columns: 1fr; } }
        .acid-form-grid .full-width { grid-column: 1 / -1; }

        .acid-form-group {
            display: flex; flex-direction: column; gap: 6px;
        }
        .acid-form-label {
            font-size: 0.8rem; font-weight: 600;
            color: var(--text-primary);
            display: flex; align-items: center; gap: 4px;
        }
        .acid-form-label .required { color: var(--danger); font-weight: 700; }

        .acid-form-input,
        .acid-form-select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--surface);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .acid-form-input:focus,
        .acid-form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
        }
        .acid-form-input.error,
        .acid-form-select.error {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(220,38,38,0.12);
        }

        .acid-form-textarea {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--surface);
            resize: vertical;
            min-height: 90px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .acid-form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
        }

        .acid-form-error {
            font-size: 0.72rem;
            color: var(--danger);
            display: none;
        }
        .acid-form-error.visible { display: block; }

        /* Upload Zone */
        .acid-upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-alt);
        }
        .acid-upload-zone:hover,
        .acid-upload-zone.drag-over {
            border-color: var(--primary);
            background: color-mix(in srgb, var(--primary) 5%, var(--surface));
        }
        .acid-upload-zone-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            opacity: 0.6;
        }
        .acid-upload-zone-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .acid-upload-zone-hint {
            font-size: 0.72rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .acid-upload-zone input[type="file"] { display: none; }

        .acid-file-list {
            display: flex; flex-direction: column; gap: 8px;
            margin-top: 12px;
        }
        .acid-file-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
        }
        .acid-file-item-icon { font-size: 1.1rem; flex-shrink: 0; }
        .acid-file-item-name { flex: 1; font-weight: 500; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .acid-file-item-size { font-size: 0.72rem; color: var(--text-secondary); }
        .acid-file-item-remove {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .acid-file-item-remove:hover { background: #FEE2E2; color: #DC2626; }

        /* Footer */
        .acid-fs-footer {
            padding: 16px 28px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            flex-shrink: 0;
            background: var(--surface);
        }
        .acid-btn-cancel {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .acid-btn-cancel:hover { border-color: var(--text-secondary); color: var(--text-primary); }

        .acid-btn-submit {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .acid-btn-submit:hover { background: #0284C7; box-shadow: 0 4px 12px rgba(14,165,233,0.3); }
        .acid-btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .acid-btn-submit .acid-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: amSpin 0.7s linear infinite;
        }

        /* ── Detail Drawer ── */
        .acid-detail-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(3px);
        }
        .acid-detail-backdrop.open { display: block; }

        .acid-detail-panel {
            position: fixed;

            height: 100vh;
