            display: none; position: fixed; inset: 0; z-index: 500;
            background: var(--overlay-bg); align-items: center;
            justify-content: center; padding: 24px;
        }
        .pac-detail-overlay.open { display: flex; }
        .pac-detail-modal {
            background: var(--surface); border-radius: var(--radius-lg);
            width: 100%; max-width: 560px; max-height: 85vh;
            overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .pac-detail-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .pac-detail-body { padding: 24px; }
        .pac-detail-row {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .pac-detail-row:last-child { border-bottom: none; }
        .pac-detail-key { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        .pac-detail-val { font-size: 0.875rem; font-weight: 500; color: var(--text-primary); text-align: right; max-width: 60%; }

        /* ── Responsive ── */
        @media(max-width:768px) {
            .pac-form-grid { grid-template-columns: 1fr; }
            .pac-toolbar { flex-direction: column; align-items: stretch; }
            .pac-stats { flex-direction: column; }
        }

        /* ═══════════════════════════════════════════════════════
           MÓDULO PRONTUÁRIOS — Visualização Clínica (prefixo prt-)
           ═══════════════════════════════════════════════════════ */

        @keyframes prtFadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        @keyframes prtPulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        @keyframes prtSlideIn { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }

        /* ── Layout principal ── */
        .prt-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 0;
            min-height: calc(100vh - 140px);
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            animation: prtFadeUp 0.4s ease both;
        }

        /* ── Painel lateral de pacientes ── */
        .prt-sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .prt-sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .prt-sidebar-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prt-search-wrap {
            position: relative;
        }

        .prt-search-input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface-alt);
            color: var(--text-primary);
            font-size: 0.84rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .prt-search-input:focus { outline: none; border-color: var(--primary); }
        .prt-search-input::placeholder { color: var(--text-secondary); }

        .prt-search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .prt-filters {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .prt-filter-btn {
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .prt-filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .prt-filter-btn:hover:not(.active) {
            background: var(--surface-alt);
            border-color: var(--text-secondary);
        }

        .prt-patient-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .prt-patient-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .prt-patient-item:hover {
            background: var(--surface-alt);
        }
        .prt-patient-item.active {
            background: color-mix(in srgb, var(--primary) 8%, var(--surface));
            border-left-color: var(--primary);
        }

        .prt-patient-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .prt-patient-item.active .prt-patient-avatar {
            background: var(--primary);
            color: #fff;
        }

        .prt-patient-info { flex: 1; min-width: 0; }
        .prt-patient-name {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .prt-patient-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prt-patient-badge {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }
        .prt-badge-ativo { background: #D1FAE5; color: #065F46; }
        .prt-badge-internado { background: #DBEAFE; color: #1E40AF; }
        .prt-badge-alta { background: #FEF3C7; color: #92400E; }

        body.dark-mode .prt-badge-ativo { background: #0e3020; color: #34D399; }
        body.dark-mode .prt-badge-internado { background: #0e2440; color: #60A5FA; }
        body.dark-mode .prt-badge-alta { background: #3d2a0e; color: #FB923C; }

        .prt-sidebar-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-align: center;
            flex-shrink: 0;
        }

        /* ── Painel principal do prontuário ── */
        .prt-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--surface-alt);
        }

        /* Cabeçalho do paciente selecionado */
        .prt-main-header {
            padding: 20px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .prt-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .prt-header-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #6366F1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(14,165,233,0.3);
        }

        .prt-header-info { min-width: 0; }
        .prt-header-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .prt-header-details {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .prt-header-detail {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .prt-header-detail strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .prt-header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .prt-header-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .prt-header-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
        .prt-header-btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .prt-header-btn.primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 14px rgba(14,165,233,0.35);
        }

        /* Tabs de navegação do prontuário */
        .prt-tabs {
            display: flex;
            gap: 0;
            padding: 0 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .prt-tab {
            padding: 12px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .prt-tab:hover {
            color: var(--text-primary);
            background: var(--surface-alt);
        }
        .prt-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Conteúdo scrollável */
        .prt-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        /* ── Cards de resumo clínico ── */
        .prt-summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .prt-summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-card);
            transition: all 0.2s;
            animation: prtFadeUp 0.4s ease both;
        }
        .prt-summary-card:nth-child(1){animation-delay:0.05s}
        .prt-summary-card:nth-child(2){animation-delay:0.1s}
        .prt-summary-card:nth-child(3){animation-delay:0.15s}
        .prt-summary-card:nth-child(4){animation-delay:0.2s}
        .prt-summary-card:hover {
            box-shadow: var(--shadow-elevated);
            transform: translateY(-2px);
        }

        .prt-summary-icon {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .prt-summary-label {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .prt-summary-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .prt-summary-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ── Timeline ── */
        .prt-timeline {
            position: relative;
            padding-left: 32px;
        }
        .prt-timeline::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
            border-radius: 2px;
        }

        .prt-timeline-item {
            position: relative;
            margin-bottom: 20px;
            animation: prtSlideIn 0.35s ease both;
        }
        .prt-timeline-item:nth-child(1){animation-delay:0.05s}
        .prt-timeline-item:nth-child(2){animation-delay:0.1s}
        .prt-timeline-item:nth-child(3){animation-delay:0.15s}
        .prt-timeline-item:nth-child(4){animation-delay:0.2s}
        .prt-timeline-item:nth-child(5){animation-delay:0.25s}

        .prt-timeline-dot {
            position: absolute;
            left: -27px;
            top: 20px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid var(--surface-alt);
            z-index: 2;
        }
        .prt-dot-blue { background: var(--primary); }
        .prt-dot-green { background: var(--success); }
        .prt-dot-orange { background: var(--warning); }
        .prt-dot-red { background: var(--danger); }
        .prt-dot-purple { background: #8B5CF6; }

        .prt-timeline-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            box-shadow: var(--shadow-card);
            transition: all 0.2s;
        }
        .prt-timeline-card:hover {
            box-shadow: var(--shadow-elevated);
            border-color: color-mix(in srgb, var(--primary) 30%, var(--border));
        }

        .prt-timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
        }

        .prt-timeline-type {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 10px;
            border-radius: 999px;
        }
        .prt-type-evolucao { background: #DBEAFE; color: #1E40AF; }
        .prt-type-prescricao { background: #D1FAE5; color: #065F46; }
        .prt-type-exame { background: #FEF3C7; color: #92400E; }
        .prt-type-procedimento { background: #EDE9FE; color: #5B21B6; }
        .prt-type-enfermagem { background: #FCE7F3; color: #9D174D; }
        .prt-type-intercorrencia { background: #FEE2E2; color: #991B1B; }

        body.dark-mode .prt-type-evolucao { background: #0e2440; color: #60A5FA; }
        body.dark-mode .prt-type-prescricao { background: #0e3020; color: #34D399; }
        body.dark-mode .prt-type-exame { background: #3d2a0e; color: #FB923C; }
        body.dark-mode .prt-type-procedimento { background: #2d1b69; color: #A78BFA; }
        body.dark-mode .prt-type-enfermagem { background: #4a1942; color: #F9A8D4; }
        body.dark-mode .prt-type-intercorrencia { background: #3d1515; color: #F87171; }

        .prt-timeline-date {
            font-size: 0.72rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .prt-timeline-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .prt-timeline-body {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .prt-timeline-footer {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .prt-timeline-author {
            font-size: 0.72rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .prt-timeline-author-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .prt-timeline-author strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        .prt-timeline-specialty {
            font-size: 0.68rem;
            color: var(--text-secondary);
            padding: 2px 8px;
            background: var(--surface-alt);
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        /* ── Dados clínicos (tab Resumo) ── */
        .prt-clinical-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .prt-clinical-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            box-shadow: var(--shadow-card);
        }

        .prt-clinical-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prt-clinical-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
        }
        .prt-clinical-row:last-child { border-bottom: none; }
        .prt-clinical-key {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .prt-clinical-val {
            color: var(--text-primary);
            font-weight: 600;
            text-align: right;
        }

        .prt-allergy-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            background: #FEE2E2;
            color: #991B1B;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            margin: 3px 3px 3px 0;
        }
        body.dark-mode .prt-allergy-tag { background: #3d1515; color: #F87171; }

        .prt-med-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
        }
        .prt-med-item:last-child { border-bottom: none; }
        .prt-med-name { font-weight: 600; color: var(--text-primary); }
        .prt-med-dose { color: var(--text-secondary); font-size: 0.75rem; }

        /* ── Empty state ── */
        .prt-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
            color: var(--text-secondary);
        }
        .prt-empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .prt-empty-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .prt-empty-desc {
            font-size: 0.85rem;
            max-width: 400px;
            line-height: 1.5;
        }

        /* ── Loading skeleton ── */
        .prt-skeleton {
            background: linear-gradient(90deg, var(--surface-alt) 25%, var(--border) 50%, var(--surface-alt) 75%);
            background-size: 200% 100%;
            animation: prtPulse 1.5s ease-in-out infinite;
            border-radius: var(--radius-sm);
        }

        /* ── Load more ── */
        .prt-load-more {
            text-align: center;
            padding: 20px;
        }
        .prt-load-more-btn {
            padding: 10px 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .prt-load-more-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* ── Tab panes ── */
        .prt-tab-pane { display: none; }
        .prt-tab-pane.active { display: block; animation: prtFadeUp 0.3s ease both; }

        /* ── Date separator ── */
        .prt-date-separator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px 0;
            padding-left: 0;
        }
        .prt-date-separator span {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .prt-date-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Toast ── */
        .prt-toast {
            position: fixed; bottom: 32px; right: 32px; z-index: 600;
            padding: 14px 24px; border-radius: var(--radius-md);
            font-size: 0.84rem; font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transform: translateY(20px); opacity: 0;
            transition: all 0.3s ease; pointer-events: none;
            display: flex; align-items: center; gap: 8px;
        }
        .prt-toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .prt-toast.info { background: var(--primary); color: #fff; }
        .prt-toast.warning { background: #F59E0B; color: #fff; }

        /* ── Responsive ── */
        @media(max-width:1024px) {
            .prt-layout { grid-template-columns: 1fr; min-height: auto; }
            .prt-sidebar { max-height: 320px; border-right: none; border-bottom: 1px solid var(--border); }
            .prt-summary-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media(max-width:768px) {
            .prt-summary-grid { grid-template-columns: 1fr; }
            .prt-clinical-grid { grid-template-columns: 1fr; }
            .prt-main-header { flex-direction: column; align-items: flex-start; }
            .prt-header-actions { width: 100%; }
            .prt-header-actions .prt-header-btn { flex: 1; justify-content: center; }
            .prt-content { padding: 16px; }
            .prt-tabs { padding: 0 16px; }
        }
        @media(max-width:480px) {
            .prt-header-details { flex-direction: column; gap: 4px; }
            .prt-tabs { gap: 0; }
            .prt-tab { padding: 10px 12px; font-size: 0.75rem; }
        }
        @media(max-width:480px) {
            .pac-table-wrap { overflow-x: auto; }
        }

        /* ═══════════════════════════════════════════════════════
           ACESSIBILIDADE — Skip link, focus-visible, reduced motion
           ═══════════════════════════════════════════════════════ */

        /* Skip link — WCAG 2.4.1 Bypass Blocks */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 16px;
            z-index: 10000;
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            font-size: 0.875rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: top 0.2s ease;
        }
        .skip-link:focus {
            top: 16px;
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        /* Focus visible global — WCAG 2.4.7 (substitui todos os outline:none) */
        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        /* Impede double-outline em elementos que já têm custom focus */
        .cfg-input:focus-visible,
        .pe-input:focus-visible,
        .pe-select:focus-visible,
        .pe-textarea:focus-visible,
        .maint-input:focus-visible,
        .maint-select:focus-visible,
        .maint-textarea:focus-visible,
        .nut-input:focus-visible,
        .nut-select:focus-visible,
        .nut-textarea:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
        }

        /* Reduced motion — WCAG 2.3.3 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ═══════════════════════════════════════════════════════
           PRINT — Estilos de impressão para relatórios
           ═══════════════════════════════════════════════════════ */
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .sidebar, .header, .notif-panel, .notif-overlay,
            .user-dropdown, .profile-modal-overlay, .skip-link, .nav-section,
            .sidebar-user, .sidebar-header { display: none !important; }
            .main-content {
                margin-left: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }
            .content-section { display: none !important; }
            .content-section.active { display: block !important; }
            .am-kpi-card, .am-chart-card, .am-spark-card,
            .am-insight-card, .hist-category-card, .cfg-card {
                break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid #ccc !important;
            }
            .am-kpi-card:hover, .am-chart-card:hover,
            .am-spark-card:hover, .am-insight-card:hover {
                transform: none !important;
                box-shadow: none !important;
            }
            a[href]::after { content: " (" attr(href) ")"; font-size: 0.75rem; }
        }

    </style>
</head>

    <script>
    function initSupabase() {
        try {
            window._supa = supabase.createClient(

        } catch(e) {

        }

    // Fallback: if onload already fired (cached script), init immediately
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof supabase !== 'undefined' && !window._supa) {
            initSupabase();
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        var submitBtn   = document.getElementById('submitBtn');
        var userInput   = document.getElementById('userInput');
        var passInput   = document.getElementById('passwordInput');
        var alertBox    = document.getElementById('formAlert');
        var alertTitle  = document.getElementById('formAlertTitle');
        var alertMsg    = document.getElementById('formAlertMsg');
        var toggleBtn   = document.getElementById('togglePassword');
        var eyeIcon     = document.getElementById('eyeIcon');

        function showAlert(title, msg, isSuccess) {
            if (!alertBox) return;
            if (alertTitle) alertTitle.textContent = title;
            if (alertMsg)   alertMsg.textContent   = msg;
            alertBox.classList.add('visible');
            alertBox.style.borderLeftColor = isSuccess ? '#10B981' : '#EF4444';
        }

        function setLoading(loading) {
            [submitBtn, userInput, passInput].forEach(function(el) {
                if (el) el.disabled = loading;
            });
        }

        // Toggle password visibility
        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', function() {
                var visible = passInput.type === 'text';
                passInput.type = visible ? 'password' : 'text';
                if (eyeIcon) {
                    eyeIcon.innerHTML = visible
                        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>'
                        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                }
            });
        }

        // LOGIN
        if (submitBtn) {
            submitBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                if (!window._supa) { showAlert('Erro de conexao.', 'Aguarde e tente novamente.', false); return; }
                var email = userInput ? userInput.value.trim() : '';
                var pass  = passInput ? passInput.value : '';
                if (!email || !pass) {
                    showAlert('Campos obrigatorios.', 'Informe e-mail e senha para continuar.', false);
                    return;
                }
                setLoading(true);
                try {
                    var r = await window._supa.auth.signInWithPassword({ email: email, password: pass });
                    if (r.error) throw r.error;
                    showAlert('Login realizado!', 'Autenticado. Carregando painel...', true);
                } catch(err) {
                    showAlert('Credenciais incorretas.', err.message || 'Verifique e-mail e senha.', false);
                } finally {
                    setLoading(false);
                }
            });
        }
    });
    </script>

            <p style="margin:6px 0 0;color:#8BAFD4;font-size:13px;">Preencha seus dados institucionais para acessar o sistema UCGS.</p>
        </div>

        <!-- Body -->
        <div style="padding:28px 32px 32px;">
            <div id="registerAlert" style="display:none;padding:12px 16px;border-radius:8px;margin-bottom:20px;
                 border-left:4px solid;font-size:13px;line-height:1.5;"></div>

            <form id="registerForm" novalidate autocomplete="off">

                <!-- SEÇÃO: Dados Pessoais -->
                <p style="margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#94A3B8;">Dados Pessoais</p>

                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regNomeCompleto">Nome completo *</label>
                    <input type="text" id="regNomeCompleto" name="nome_completo" required placeholder="Ex.: Dra. Maria da Silva"
                           style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                </div>

                <!-- SEÇÃO: Dados Profissionais -->
                <p style="margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#94A3B8;
                          border-top:1px solid #F1F5F9;padding-top:18px;">Dados Profissionais</p>

                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regRole">Função / Categoria *</label>
                    <select id="regRole" name="role" required
                            style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;background:#fff;transition:border 0.2s;">
                        <option value="">Selecione...</option>
                        <option value="medico">Médico(a)</option>
                        <option value="enfermeiro">Enfermeiro(a)</option>
                        <option value="fisio">Fisioterapeuta</option>
                        <option value="dentista">Dentista</option>
                        <option value="psicologo">Psicólogo(a)</option>
                        <option value="nutricionista">Nutricionista</option>
                        <option value="sesmt">SESMT</option>
                        <option value="admin">Administrador do Sistema</option>
                    </select>
                </div>

                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regEspecialidade">Especialidade</label>
                    <input type="text" id="regEspecialidade" name="especialidade" placeholder="Ex.: Cardiologia, Pediatria, UTI..."
                           style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regRegistro">Registro Profissional</label>
                        <input type="text" id="regRegistro" name="registro_profissional" placeholder="CRM, COREN, CREFITO..."
                               style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                    </div>
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regMatricula">Matrícula Institucional</label>
                        <input type="text" id="regMatricula" name="matricula" placeholder="Ex.: 2024001"
                               style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                    </div>
                </div>

                <div style="margin-bottom:20px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regSetor">Setor / Unidade</label>
                    <input type="text" id="regSetor" name="setor" placeholder="Ex.: UTI Adulto, Ambulatório, SESMT..."
                           style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                </div>

                <!-- SEÇÃO: Dados de Acesso -->
                <p style="margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#94A3B8;
                          border-top:1px solid #F1F5F9;padding-top:18px;">Dados de Acesso</p>

                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regEmail">E-mail institucional *</label>
                    <input type="email" id="regEmail" name="email" required placeholder="nome@ucgs.edu.br"
                           style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;">
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regSenha">Senha *</label>
                        <input type="password" id="regSenha" name="senha" required minlength="8" placeholder="Mín. 8 caracteres"
                               style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                    </div>
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;" for="regConfirmar">Confirmar senha *</label>
                        <input type="password" id="regConfirmar" name="confirmar" required placeholder="Repita a senha"
                               style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #D1D5DB;border-radius:8px;font-size:14px;color:#111827;outline:none;transition:border 0.2s;" />
                    </div>
                </div>

                <!-- Password strength -->
                <div id="regStrengthWrap" style="margin-bottom:20px;display:none;">
                    <div style="height:4px;border-radius:4px;background:#E5E7EB;overflow:hidden;margin-bottom:4px;">
                        <div id="regStrengthBar" style="height:100%;width:0%;transition:width 0.3s,background 0.3s;border-radius:4px;"></div>
                    </div>
                    <span id="regStrengthLabel" style="font-size:11px;color:#6B7280;"></span>
                </div>

                <!-- LGPD -->
                <label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:24px;cursor:pointer;font-size:13px;color:#4B5563;line-height:1.5;">
                    <input type="checkbox" id="regLgpd" required style="margin-top:2px;accent-color:#1B6EF5;flex-shrink:0;" />
                    <span>Declaro que li e aceito os
                        <a href="#" style="color:#1B6EF5;text-decoration:none;font-weight:600;">Termos de Uso</a> e a
                        <a href="#" style="color:#1B6EF5;text-decoration:none;font-weight:600;">Política de Privacidade</a>
                        do sistema UCGS, em conformidade com a LGPD.
                    </span>
                </label>

                <button type="submit" id="regSubmitBtn"
                        style="width:100%;padding:14px;background:linear-gradient(135deg,#1B6EF5,#0D50BF);color:#fff;border:none;
                               border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.2px;
                               display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity 0.2s;">
                    <span id="regSubmitLabel">Criar minha conta</span>
                </button>

                <p style="text-align:center;margin:16px 0 0;color:#6B7280;font-size:13px;">
                    Já possui acesso?
                    <button type="button" id="backToLoginBtn"
                            style="background:none;border:none;color:#1B6EF5;font-weight:600;cursor:pointer;font-size:13px;padding:0;">
                        Entrar no sistema
                    </button>
                </p>
            </form>
        </div>
    </div>
</div>

<style>
@keyframes modalSlideIn {
    from { opacity:0; transform:translateY(-20px) scale(0.98); }
    to   { opacity:1; transform:translateY(0) scale(1); }
}
#registerModal input:focus, #registerModal select:focus {
    border-color:#1B6EF5 !important;
    box-shadow:0 0 0 3px rgba(27,110,245,0.12);
}
</style>

    <!-- Register Modal Script v2 -->
    <script>
    (function() {
        var modal     = document.getElementById('registerModal');
        var openBtn   = document.getElementById('registerBtn');
        var closeBtn  = document.getElementById('closeRegisterModal');
        var backBtn   = document.getElementById('backToLoginBtn');
        var form      = document.getElementById('registerForm');
        var submitBtn = document.getElementById('regSubmitBtn');
        var submitLbl = document.getElementById('regSubmitLabel');
        var alertBox  = document.getElementById('registerAlert');

        function showAlert(msg, isSuccess) {
            if (!alertBox) return;
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
            alertBox.style.background  = isSuccess ? '#ECFDF5' : '#FEF2F2';
            alertBox.style.borderColor = isSuccess ? '#10B981' : '#EF4444';
            alertBox.style.color       = isSuccess ? '#065F46' : '#991B1B';
        }

        function openModal() { modal.style.display='flex'; document.getElementById('regNomeCompleto').focus(); }
        function closeModal(){ modal.style.display='none'; }

        if (openBtn)  openBtn.addEventListener('click',  openModal);
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (backBtn)  backBtn.addEventListener('click',  closeModal);
        modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
        document.addEventListener('keydown', function(e){ if(e.key==='Escape' && modal.style.display==='flex') closeModal(); });

        // Password strength
        var senhaInput = document.getElementById('regSenha');
        if (senhaInput) {
            senhaInput.addEventListener('input', function() {
                var pw   = this.value;
                var wrap = document.getElementById('regStrengthWrap');
                var bar  = document.getElementById('regStrengthBar');
                var lbl  = document.getElementById('regStrengthLabel');
                if (!pw) { wrap.style.display='none'; return; }
                wrap.style.display='block';
                var s = 0;
                if (pw.length >= 8)       s++;
                if (/[A-Z]/.test(pw))     s++;
                if (/[0-9]/.test(pw))     s++;
                if (/[^A-Za-z0-9]/.test(pw)) s++;
                var lvl = [
                    {p:'25%', c:'#EF4444', t:'Senha fraca'},
                    {p:'50%', c:'#F59E0B', t:'Senha razoável'},
                    {p:'75%', c:'#3B82F6', t:'Senha boa'},
                    {p:'100%',c:'#10B981', t:'Senha forte'},
                ][s-1] || {p:'25%',c:'#EF4444',t:'Senha fraca'};
                bar.style.width=lvl.p; bar.style.background=lvl.c;
                lbl.style.color=lvl.c; lbl.textContent=lvl.t;
            });
        }

        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                var nomeCompleto         = (document.getElementById('regNomeCompleto')?.value || '').trim();
                var role                 = document.getElementById('regRole')?.value || '';
                var especialidade        = (document.getElementById('regEspecialidade')?.value || '').trim();
                var registro_profissional= (document.getElementById('regRegistro')?.value || '').trim();
                var matricula            = (document.getElementById('regMatricula')?.value || '').trim();
                var setor                = (document.getElementById('regSetor')?.value || '').trim();
                var email                = (document.getElementById('regEmail')?.value || '').trim();
                var senha                = document.getElementById('regSenha')?.value || '';
                var confirmar            = document.getElementById('regConfirmar')?.value || '';
                var lgpd                 = document.getElementById('regLgpd')?.checked;

                if (!nomeCompleto || !role || !email || !senha || !confirmar) {
                    showAlert('Preencha todos os campos obrigatórios (*).', false); return;
                }
                if (senha.length < 8) {
                    showAlert('A senha deve ter no mínimo 8 caracteres.', false); return;
                }
                if (senha !== confirmar) {
                    showAlert('As senhas não coincidem. Verifique e tente novamente.', false); return;
                }
                if (!lgpd) {
                    showAlert('Você precisa aceitar os Termos de Uso para continuar.', false); return;
                }

                var client = window._supa;
                if (!client) {
                    showAlert('Conexão com o servidor não estabelecida. Aguarde e tente novamente.', false); return;
                }

                submitBtn.disabled = true;
                submitLbl.textContent = 'Criando conta...';

                try {
                    var r = await client.auth.signUp({
                        email: email,
                        password: senha,
                        options: {
                            data: {
                                nome_completo:          nomeCompleto,
                                role:                   role,
                                especialidade:          especialidade,
                                registro_profissional:  registro_profissional,
                                matricula:              matricula,
                                setor:                  setor
                            }
                        }
                    });

                    if (r.error) throw r.error;

                    showAlert('Conta criada com sucesso! Você já pode fazer login.', true);
                    submitLbl.textContent = 'Conta criada!';

                    setTimeout(function() {
                        closeModal();
                        var loginInput = document.getElementById('userInput');
                        if (loginInput) loginInput.value = email;
                        var passInput = document.getElementById('passwordInput');
                        if (passInput) passInput.focus();
                    }, 2500);

                } catch(err) {
                    console.error('[UCGS] Erro no registro:', err);
                    var msg = err.message || 'Não foi possível criar a conta.';
                    if (msg.includes('already registered')) msg = 'Este e-mail já está cadastrado. Use a opção "Entrar no sistema".';
                    if (msg.includes('Password'))          msg = 'Senha muito fraca. Use letras maiúsculas, números e símbolos.';
                    showAlert(msg, false);
                    submitBtn.disabled = false;
                    submitLbl.textContent = 'Criar minha conta';
                }
            });
        }
    })();
    </script>
</body>
</html>
